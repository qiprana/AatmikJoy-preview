name: Deploy Aatmik Joy preview

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download current review branch of AatmikJoy
        run: |
          git clone --depth 1 --branch feature/today-self-care-planner https://github.com/qiprana/AatmikJoy.git site
      - name: Check navigation startup and link essentials
        run: |
          node --check site/assets/app.js
          node --check site/assets/today.js
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const js = fs.readFileSync('site/assets/app.js', 'utf8');
          const html = fs.readFileSync('site/index.html', 'utf8');
          assert(js.includes("$('.filter').forEach(button => button.addEventListener('click'"), 'Topic filters must use the multi-element selector');
          assert(!js.includes("  $('.filter').forEach("), 'Fatal single-element selector bug has returned');
          for (const id of ['page-home','page-explore','page-reflections','page-connect','page-products','page-today','reflection-grid','reflection-search','reflection-show-more','site-search-dialog','primary-nav','menu-toggle']) {
            assert(html.includes('id="' + id + '"'), 'Missing required navigation UI element: ' + id);
          }
          for (const route of ['home','explore','reflections','connect','products']) {
            assert(html.includes('href="#/' + route + '"'), 'Missing link: ' + route);
          }
          console.log('Navigation startup and required links passed.');
          NODE
      - name: Prepare separate preview site
        run: |
          rm -f site/CNAME
          printf '%s\n' 'preview.aatmikjoy.me' > site/CNAME
          printf '%s\n' 'User-agent: *' 'Disallow: /' > site/robots.txt
          touch site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Allow Pages artifact metadata to settle
        run: sleep 15
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
