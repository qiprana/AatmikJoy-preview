name: Deploy Aatmik Joy preview

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download current review branch of AatmikJoy
        run: |
          git clone --depth 1 --branch feature/today-self-care-planner https://github.com/qiprana/AatmikJoy.git site
      - name: Prepare separate preview site
        run: |
          rm -f site/CNAME
          printf '%s\n' 'preview.aatmikjoy.me' > site/CNAME
          printf '%s\n' 'User-agent: *' 'Disallow: /' > site/robots.txt
          touch site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
